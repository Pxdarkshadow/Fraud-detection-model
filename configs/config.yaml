# Fraud Detection — Training Configuration
# Reference file. Code reads from src/fraud_detection/config.py.

dataset:
  path: data/creditcard.csv
  target: Class
  features:
    - Time
    - V1-V28  # 28 PCA-transformed anonymized features
    - Amount

split:
  test_ratio: 0.15
  val_ratio: 0.30
  method: chronological  # split on Time column; stratified holdout within the val band (see pipeline.py)

training:
  seed: 42
  model: LightGBM
  params:
    objective: binary
    metric: auc
    learning_rate: 0.02
    num_leaves: 96
    max_depth: -1
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.9
    bagging_freq: 1
    scale_pos_weight: 10
  early_stopping_rounds: 300
  num_boost_round: 3000

output:
  model_path: models/fraud_model.txt
  threshold_path: models/threshold.txt
